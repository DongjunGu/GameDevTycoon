<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>StatTickPopup 시각화</title>
<style>
  body {
    background: #2a2a2a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  h2 { margin: 0 0 10px; color: #aaa; font-weight: 400; }
  .stage-row { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
  .label { color: #888; font-size: 13px; min-width: 60px; }

  /* StatTickPopup 본체 */
  .popup {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    position: relative;
  }
  .icon {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-size: 12px; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.2);
  }
  .icon.stat-art      { background: linear-gradient(135deg, #ff8a4c, #ff6b35); color: white; }
  .icon.stat-planning { background: linear-gradient(135deg, #6aa9ff, #3b78d8); color: white; }
  .icon.stat-develop  { background: linear-gradient(135deg, #56e078, #2ea84d); color: white; }
  .icon.stat-bug      { background: linear-gradient(135deg, #ff6b6b, #c92a2a); color: white; }

  .number {
    font-size: 32px; font-weight: 800;
    min-width: 60px; text-align: left;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .num-jackpot { color: #ffd93d; }
  .num-success-planning { color: #6aa9ff; }
  .num-success-develop  { color: #56e078; }
  .num-success-art      { color: #ffae6b; }
  .num-bug              { color: #ff6b6b; }

  /* 잭팟 파티클 시뮬레이션 */
  .popup.jackpot::before,
  .popup.jackpot::after {
    content: '';
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ffd93d;
    box-shadow:
      0 0 8px #ffd93d,
      0 0 16px #ffae00;
    pointer-events: none;
  }
  .popup.jackpot::before {
    top: -4px; left: 0;
    animation: spark1 1.2s ease-out infinite;
  }
  .popup.jackpot::after {
    top: 50%; right: 8px;
    animation: spark2 1.2s ease-out infinite 0.3s;
  }
  @keyframes spark1 {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate(-30px, -40px) scale(0.2); opacity: 0; }
  }
  @keyframes spark2 {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate(30px, -50px) scale(0.2); opacity: 0; }
  }
  /* 추가 파티클 */
  .popup.jackpot {
    background-image: radial-gradient(circle at 30% 50%, rgba(255, 217, 61, 0.15), transparent 60%);
  }
  .popup.jackpot .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #fff8b0;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffd93d, 0 0 12px #ffae00;
    pointer-events: none;
  }
  .popup.jackpot .s1 { top: 10px;  left: 20px; animation: spark3 1.0s ease-out infinite; }
  .popup.jackpot .s2 { top: 30px;  left: 60px; animation: spark3 1.2s ease-out infinite 0.4s; }
  .popup.jackpot .s3 { bottom: 4px; left: 30px; animation: spark3 1.4s ease-out infinite 0.7s; }
  .popup.jackpot .s4 { top: 0px;   right: 20px; animation: spark3 1.1s ease-out infinite 0.2s; }
  @keyframes spark3 {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(0, -30px) scale(0); opacity: 0; }
  }

  /* 캐릭터 위 배치 시뮬레이션 */
  .scene {
    background: #3d3d3d;
    border-radius: 12px;
    padding: 30px;
    position: relative;
    height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .scene .popup-floating {
    position: absolute;
    top: 30px;
    background: rgba(0,0,0,0.45);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .character {
    width: 60px; height: 90px;
    background: #f4d4a4;
    border-radius: 30px 30px 8px 8px;
    position: relative;
  }
  .character::before {
    content: ''; position: absolute;
    top: 18px; left: 18px;
    width: 8px; height: 8px;
    background: #333; border-radius: 50%;
    box-shadow: 16px 0 0 #333;
  }
  .desk {
    width: 120px; height: 12px;
    background: #6b4423;
    margin-top: 4px;
    border-radius: 2px;
  }

  /* 라이브 데모 */
  .live-demo {
    background: #3d3d3d;
    border-radius: 12px;
    padding: 30px;
    display: flex;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
  }
  button {
    padding: 10px 18px;
    background: #4a90e2;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #357abd; }
  button.jackpot { background: #f59f00; }
  button.jackpot:hover { background: #d68500; }
  button.bug { background: #c92a2a; }
  button.bug:hover { background: #a01818; }

  .note {
    color: #888; font-size: 13px; line-height: 1.5;
  }
</style>
</head>
<body>

<h2>1. 잭팟 (스탯 아이콘 + 숫자 + 파티클)</h2>
<div class="stage-row">
  <span class="label">아트</span>
  <div class="popup jackpot">
    <span class="sparkle s1"></span>
    <span class="sparkle s2"></span>
    <span class="sparkle s3"></span>
    <span class="sparkle s4"></span>
    <div class="icon stat-art">ART</div>
    <div class="number num-jackpot">+5</div>
  </div>

  <span class="label">개발</span>
  <div class="popup jackpot">
    <span class="sparkle s1"></span>
    <span class="sparkle s2"></span>
    <span class="sparkle s3"></span>
    <span class="sparkle s4"></span>
    <div class="icon stat-develop">DEV</div>
    <div class="number num-jackpot">+8</div>
  </div>

  <span class="label">기획</span>
  <div class="popup jackpot">
    <span class="sparkle s1"></span>
    <span class="sparkle s2"></span>
    <span class="sparkle s3"></span>
    <span class="sparkle s4"></span>
    <div class="icon stat-planning">PLN</div>
    <div class="number num-jackpot">+3</div>
  </div>
</div>

<h2>2. 성공 (스탯 아이콘 + 숫자, 파티클 없음)</h2>
<div class="stage-row">
  <span class="label">기획</span>
  <div class="popup">
    <div class="icon stat-planning">PLN</div>
    <div class="number num-success-planning">+2</div>
  </div>

  <span class="label">개발</span>
  <div class="popup">
    <div class="icon stat-develop">DEV</div>
    <div class="number num-success-develop">+3</div>
  </div>

  <span class="label">아트</span>
  <div class="popup">
    <div class="icon stat-art">ART</div>
    <div class="number num-success-art">+1</div>
  </div>
</div>

<h2>3. 버그 (버그 아이콘 + 숫자, 빨간색)</h2>
<div class="stage-row">
  <div class="popup">
    <div class="icon stat-bug">BUG</div>
    <div class="number num-bug">+6</div>
  </div>
</div>

<h2>4. 꽝 — 스프라이트만 표시 (숫자·파티클 없음)</h2>
<div class="stage-row">
  <div class="popup">
    <div class="icon" style="background: linear-gradient(135deg, #adb5bd, #495057); color: white;">꽝</div>
  </div>
  <span class="note">target=0 → numberLabel 비활성, blankDuration(1.5초) 동안 표시 후 사라짐.</span>
</div>

<h2>5. 캐릭터 위 배치</h2>
<div class="scene">
  <div class="popup-floating">
    <div class="popup jackpot">
      <span class="sparkle s1"></span>
      <span class="sparkle s2"></span>
      <span class="sparkle s3"></span>
      <span class="sparkle s4"></span>
      <div class="icon stat-art">ART</div>
      <div class="number num-jackpot">+3</div>
    </div>
  </div>
  <div class="character"></div>
  <div class="desk"></div>
</div>

<h2>6. 라이브 데모 (실제 0.5초 카운트업)</h2>
<div class="live-demo">
  <div class="popup" id="livePopup">
    <span class="sparkle s1" style="display:none"></span>
    <span class="sparkle s2" style="display:none"></span>
    <span class="sparkle s3" style="display:none"></span>
    <span class="sparkle s4" style="display:none"></span>
    <div class="icon stat-art" id="liveIcon">ART</div>
    <div class="number num-jackpot" id="liveNumber">+0</div>
  </div>
  <button class="jackpot" onclick="runDemo(5, 'art', 'jackpot', true)">잭팟 아트 +5</button>
  <button class="jackpot" onclick="runDemo(8, 'develop', 'jackpot', true)">잭팟 개발 +8</button>
  <button onclick="runDemo(2, 'planning', 'success-planning', false)">성공 기획 +2</button>
  <button onclick="runDemo(3, 'develop', 'success-develop', false)">성공 개발 +3</button>
  <button class="bug" onclick="runDemo(6, 'bug', 'bug', false)">버그 +6</button>
</div>

<script>
const TOTAL = 3000; // 3초
let demoTimer = null;
function runDemo(target, statClass, numClass, jackpot) {
  if (demoTimer) clearInterval(demoTimer);

  const popup = document.getElementById('livePopup');
  const icon  = document.getElementById('liveIcon');
  const numEl = document.getElementById('liveNumber');

  // 클래스 리셋
  icon.className = 'icon stat-' + statClass;
  icon.textContent = ({ art: 'ART', develop: 'DEV', planning: 'PLN', bug: 'BUG' })[statClass];
  numEl.className = 'number num-' + numClass;
  popup.classList.toggle('jackpot', jackpot);

  popup.querySelectorAll('.sparkle').forEach(s => {
    s.style.display = jackpot ? 'block' : 'none';
  });

  let i = 0;
  numEl.textContent = '+0';
  const interval = TOTAL / target;
  demoTimer = setInterval(() => {
    i++;
    numEl.textContent = `+${i}`;
    if (i >= target) {
      clearInterval(demoTimer);
      demoTimer = null;
    }
  }, interval);
}
</script>

</body>
</html>
