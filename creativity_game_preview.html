<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>창의성 미니게임 예상도</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: #1a1a2e;
  font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
  user-select: none;
  overflow: hidden;
}

/* ── 오버레이 & 카드 ─────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 28px 32px 24px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 560px;
}

/* ── 헤더 ────────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.title {
  font-size: 17px;
  font-weight: 700;
  color: #222;
  letter-spacing: -0.3px;
}

.restart-btn {
  position: absolute; right: 0;
  background: #f1f3f5;
  border: none; border-radius: 8px;
  padding: 5px 12px;
  font-size: 12px; cursor: pointer;
  color: #555;
  transition: background .15s;
}
.restart-btn:hover { background: #e9ecef; }

/* ── 바디 (좌: 그리드 / 우: 블록) ───────────────────────────── */
.body {
  display: flex;
  gap: 28px;
  align-items: flex-start;
}

/* ── 그리드 영역 ─────────────────────────────────────────────── */
.grid-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.grid-name {
  font-size: 12px;
  color: #888;
  font-weight: 500;
}

.grid-wrap {
  position: relative;
  line-height: 0;
}

#gridCells {
  display: grid;
  gap: 5px;
}

.cell {
  width: 54px; height: 54px;
  border-radius: 9px;
  transition: background .12s;
}
.cell.empty   { background: #dde8fa; }
.cell.missing { visibility: hidden; background: transparent; }
.cell.filled  { }

#ghostOverlay {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 10;
}

.ghost-cell {
  position: absolute;
  width: 54px; height: 54px;
  border-radius: 9px;
}
.ghost-cell.valid   { background: rgba(62, 220, 110, 0.62); }
.ghost-cell.invalid { background: rgba(240, 65,  65, 0.42); }

/* ── 블록 트레이 영역 (오른쪽) ─────────────────────────────── */
.tray-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.score-text {
  font-size: 15px;
  font-weight: 700;
  color: #5c7cfa;
  letter-spacing: -0.3px;
}

.block-tray {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.block-slot {
  width: 128px; height: 128px;
  background: #edf2ff;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #d0d9ff;
  transition: border-color .15s, background .15s;
}
.block-slot.used {
  background: #f8f9fa;
  border-color: #e9ecef;
}

/* ── 블록 비주얼 ─────────────────────────────────────────────── */
.block-visual {
  position: relative;
  cursor: grab;
  transition: opacity .15s, transform .1s;
}
.block-visual:hover { transform: scale(1.06); }
.block-visual.faded { opacity: 0.3; cursor: default; }

.block-cell-div {
  position: absolute;
  border-radius: 6px;
  border: 2px solid rgba(0,0,0,0.12);
}

/* ── 드래그 프록시 ───────────────────────────────────────────── */
#dragProxy {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  display: none;
  opacity: 0.9;
}

/* ── 확인 버튼 ───────────────────────────────────────────────── */
.confirm-area {
  display: flex;
  justify-content: center;
}

.confirm-btn {
  padding: 11px 56px;
  background: linear-gradient(135deg, #5c7cfa, #4263eb);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 12px rgba(92,124,250,0.35);
  transition: opacity .15s, transform .1s;
}
.confirm-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.confirm-btn:active { transform: translateY(0); }
</style>
</head>
<body>

<div class="overlay">
  <div class="card">

    <!-- 헤더 -->
    <div class="header">
      <div class="title">창의성 미니게임</div>
      <button class="restart-btn" onclick="init()">↺ 다시시작</button>
    </div>

    <!-- 바디 -->
    <div class="body">

      <!-- 왼쪽: 그리드 -->
      <div class="grid-area">
        <div class="grid-name" id="gridName">그리드: —</div>
        <div class="grid-wrap">
          <div id="gridCells"></div>
          <div id="ghostOverlay"></div>
        </div>
      </div>

      <!-- 오른쪽: 블록 트레이 -->
      <div class="tray-area">
        <div class="score-text" id="scoreText">창의성 +0</div>
        <div class="block-tray" id="blockTray"></div>
      </div>

    </div>

    <!-- 확인 -->
    <div class="confirm-area">
      <button class="confirm-btn" onclick="onConfirm()">확인</button>
    </div>

  </div>
</div>

<div id="dragProxy"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// 데이터 (CreativityGameData.cs 동일)
// ═══════════════════════════════════════════════════════════════
const BLOCK_DEFS = [
  { name:'Dot',  cells:[[0,0]],                         color:'#FFEE58' },
  { name:'H2',   cells:[[0,0],[0,1]],                   color:'#FFD600' },
  { name:'V2',   cells:[[0,0],[1,0]],                   color:'#FFD600' },
  { name:'G_BR', cells:[[0,0],[1,0],[1,1]],             color:'#40C057' },
  { name:'G_BL', cells:[[0,1],[1,0],[1,1]],             color:'#40C057' },
  { name:'G_TR', cells:[[0,0],[0,1],[1,0]],             color:'#40C057' },
  { name:'G_TL', cells:[[0,0],[0,1],[1,1]],             color:'#40C057' },
  { name:'V3',   cells:[[0,0],[1,0],[2,0]],             color:'#40C057' },
  { name:'H3',   cells:[[0,0],[0,1],[0,2]],             color:'#40C057' },
  { name:'Sq',   cells:[[0,0],[0,1],[1,0],[1,1]],       color:'#F06595' },
  { name:'L_R',  cells:[[0,0],[1,0],[2,0],[2,1]],       color:'#F06595' },
  { name:'J_L',  cells:[[0,1],[1,1],[2,0],[2,1]],       color:'#F06595' },
  { name:'L_D',  cells:[[0,0],[0,1],[0,2],[1,0]],       color:'#F06595' },
  { name:'J_D',  cells:[[0,0],[0,1],[0,2],[1,2]],       color:'#F06595' },
  { name:'T_D',  cells:[[0,0],[0,1],[0,2],[1,1]],       color:'#F06595' },
  { name:'T_R',  cells:[[0,1],[1,0],[1,1],[2,1]],       color:'#F06595' },
  { name:'T_L',  cells:[[0,0],[1,0],[1,1],[2,0]],       color:'#F06595' },
  { name:'T_U',  cells:[[0,1],[1,0],[1,1],[1,2]],       color:'#F06595' },
  { name:'S',    cells:[[0,1],[0,2],[1,0],[1,1]],       color:'#F06595' },
  { name:'Z',    cells:[[0,0],[0,1],[1,1],[1,2]],       color:'#F06595' },
  { name:'S_V',  cells:[[0,0],[1,0],[1,1],[2,1]],       color:'#F06595' },
  { name:'Z_V',  cells:[[0,1],[1,0],[1,1],[2,0]],       color:'#F06595' },
  { name:'V4',   cells:[[0,0],[1,0],[2,0],[3,0]],       color:'#F06595' },
  { name:'H4',   cells:[[0,0],[0,1],[0,2],[0,3]],       color:'#F06595' },
];

function fullGrid(rows, cols, exclude = []) {
  const ex = new Set(exclude.map(([r,c]) => `${r},${c}`));
  const cells = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!ex.has(`${r},${c}`)) cells.push([r,c]);
  return cells;
}

const GRID_DEFS = [
  { name:'3×3',    rows:3, cols:3, cells: fullGrid(3,3) },
  { name:'4×4',    rows:4, cols:4, cells: fullGrid(4,4) },
  { name:'5×5',    rows:5, cols:5, cells: fullGrid(5,5) },
  { name:'Plus',   rows:5, cols:5, cells: fullGrid(5,5,[[0,0],[0,4],[4,0],[4,4]]) },
  { name:'4×4-A',  rows:4, cols:4, cells: fullGrid(4,4,[[0,3]]) },
  { name:'5×5-TR', rows:5, cols:5, cells: fullGrid(5,5,[[0,3],[0,4],[1,3],[1,4]]) },
];

// ═══════════════════════════════════════════════════════════════
// 상수
// ═══════════════════════════════════════════════════════════════
const GRID_CELL = 54, GRID_GAP = 5, GRID_STEP = 59;
const TRAY_CELL = 30, TRAY_GAP = 3, TRAY_STEP = 33;

// ═══════════════════════════════════════════════════════════════
// 게임 상태
// ═══════════════════════════════════════════════════════════════
let G = null;        // { rows, cols, validSet, filledMap }
let tray = [];       // [{ def, slotEl, visualEl } | null]
let score = 0;

// ═══════════════════════════════════════════════════════════════
// 그리드 생성
// ═══════════════════════════════════════════════════════════════
function buildGrid(def) {
  G = {
    rows: def.rows, cols: def.cols,
    validSet: new Set(def.cells.map(([r,c]) => `${r},${c}`)),
    filledMap: {}
  };

  const el = document.getElementById('gridCells');
  el.innerHTML = '';
  el.style.gridTemplateColumns = `repeat(${def.cols}, ${GRID_CELL}px)`;
  el.style.gridTemplateRows    = `repeat(${def.rows}, ${GRID_CELL}px)`;
  el.style.gap = `${GRID_GAP}px`;

  for (let r = 0; r < def.rows; r++) {
    for (let c = 0; c < def.cols; c++) {
      const d = document.createElement('div');
      d.id = `g-${r}-${c}`;
      d.className = G.validSet.has(`${r},${c}`) ? 'cell empty' : 'cell missing';
      el.appendChild(d);
    }
  }

  document.getElementById('gridName').textContent = `그리드: ${def.name}`;
  document.getElementById('ghostOverlay').innerHTML = '';
}

// ═══════════════════════════════════════════════════════════════
// 블록 비주얼 생성
// ═══════════════════════════════════════════════════════════════
function makeBlockVisual(def, cellSize, cellGap) {
  const step = cellSize + cellGap;
  const rs = def.cells.map(c => c[0]), cs = def.cells.map(c => c[1]);
  const minR = Math.min(...rs), maxR = Math.max(...rs);
  const minC = Math.min(...cs), maxC = Math.max(...cs);

  const wrap = document.createElement('div');
  wrap.className = 'block-visual';
  wrap.style.width  = ((maxC - minC + 1) * step - cellGap) + 'px';
  wrap.style.height = ((maxR - minR + 1) * step - cellGap) + 'px';

  def.cells.forEach(([r,c]) => {
    const d = document.createElement('div');
    d.className = 'block-cell-div';
    d.style.cssText = `
      width:${cellSize}px; height:${cellSize}px;
      left:${(c - minC) * step}px; top:${(r - minR) * step}px;
      background:${def.color};
      border-color:${shade(def.color, -28)};
    `;
    wrap.appendChild(d);
  });
  return wrap;
}

function shade(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt));
  const b = Math.max(0, Math.min(255, (n & 0xff) + amt));
  return `rgb(${r},${g},${b})`;
}

// ═══════════════════════════════════════════════════════════════
// 블록 트레이 생성
// ═══════════════════════════════════════════════════════════════
function spawnBlocks() {
  const trayEl = document.getElementById('blockTray');
  trayEl.innerHTML = '';
  tray = [];

  for (let i = 0; i < 3; i++) {
    const def = BLOCK_DEFS[Math.floor(Math.random() * BLOCK_DEFS.length)];

    const slot = document.createElement('div');
    slot.className = 'block-slot';

    const vis = makeBlockVisual(def, TRAY_CELL, TRAY_GAP);
    vis.dataset.idx = i;
    slot.appendChild(vis);
    trayEl.appendChild(slot);

    tray.push({ def, slotEl: slot, visualEl: vis });
    bindDrag(vis, i);
  }
}

// ═══════════════════════════════════════════════════════════════
// 드래그
// ═══════════════════════════════════════════════════════════════
let drag = null;
const proxy = document.getElementById('dragProxy');

function bindDrag(vis, idx) {
  vis.addEventListener('mousedown', e => {
    if (!tray[idx]) return;
    e.preventDefault();

    const def = tray[idx].def;
    const pVis = makeBlockVisual(def, GRID_CELL, GRID_GAP);
    proxy.innerHTML = '';
    proxy.appendChild(pVis);
    proxy.style.display = 'block';

    const pw = parseFloat(pVis.style.width);
    const ph = parseFloat(pVis.style.height);

    drag = { idx, def, pw, ph };
    tray[idx].visualEl.classList.add('faded');
    posProxy(e.clientX, e.clientY);
  });
}

function posProxy(x, y) {
  if (!drag) return;
  proxy.style.left = (x - drag.pw / 2) + 'px';
  proxy.style.top  = (y - drag.ph / 2 - 18) + 'px';
}

document.addEventListener('mousemove', e => {
  if (!drag) return;
  posProxy(e.clientX, e.clientY);
  const snap = calcSnap(e.clientX, e.clientY, drag.def.cells);
  renderGhost(drag.def, snap);
});

document.addEventListener('mouseup', e => {
  if (!drag) return;

  const snap  = calcSnap(e.clientX, e.clientY, drag.def.cells);
  const valid = snap && checkValid(drag.def.cells, snap);

  clearGhost();
  proxy.style.display = 'none';

  if (valid) {
    placeBlock(drag.def, snap);
    tray[drag.idx].slotEl.innerHTML = '';
    tray[drag.idx].slotEl.classList.add('used');
    tray[drag.idx] = null;
    refreshScore();
  } else {
    if (tray[drag.idx]) tray[drag.idx].visualEl.classList.remove('faded');
  }

  drag = null;
});

// ═══════════════════════════════════════════════════════════════
// 스냅 계산 (CreativityGameGridUI.TryGetSnapAnchor 와 동일)
// ═══════════════════════════════════════════════════════════════
function calcSnap(mx, my, cells) {
  const rect = document.getElementById('gridCells').getBoundingClientRect();
  const relX = mx - rect.left;
  const relY = my - rect.top;

  const rs = cells.map(c => c[0]), cs = cells.map(c => c[1]);
  const minR = Math.min(...rs), maxR = Math.max(...rs);
  const minC = Math.min(...cs), maxC = Math.max(...cs);

  return {
    row: Math.round(relY / GRID_STEP - (minR + maxR) / 2),
    col: Math.round(relX / GRID_STEP - (minC + maxC) / 2),
  };
}

function checkValid(cells, a) {
  return cells.every(([r,c]) => {
    const gr = a.row + r, gc = a.col + c;
    return G.validSet.has(`${gr},${gc}`) && !G.filledMap[`${gr},${gc}`];
  });
}

// ═══════════════════════════════════════════════════════════════
// 고스트
// ═══════════════════════════════════════════════════════════════
function renderGhost(def, anchor) {
  clearGhost();
  if (!anchor) return;
  const valid = checkValid(def.cells, anchor);
  const ov = document.getElementById('ghostOverlay');

  def.cells.forEach(([r,c]) => {
    const gr = anchor.row + r, gc = anchor.col + c;
    if (gr < 0 || gr >= G.rows || gc < 0 || gc >= G.cols) return;
    if (!G.validSet.has(`${gr},${gc}`)) return;

    const d = document.createElement('div');
    d.className = `ghost-cell ${valid ? 'valid' : 'invalid'}`;
    d.style.left = (gc * GRID_STEP) + 'px';
    d.style.top  = (gr * GRID_STEP) + 'px';
    ov.appendChild(d);
  });
}

function clearGhost() {
  document.getElementById('ghostOverlay').innerHTML = '';
}

// ═══════════════════════════════════════════════════════════════
// 배치
// ═══════════════════════════════════════════════════════════════
function placeBlock(def, a) {
  def.cells.forEach(([r,c]) => {
    const gr = a.row + r, gc = a.col + c;
    G.filledMap[`${gr},${gc}`] = def.color;
    const el = document.getElementById(`g-${gr}-${gc}`);
    if (el) {
      el.className = 'cell filled';
      el.style.background = def.color;
      el.style.boxShadow  = `inset 0 -3px 0 ${shade(def.color,-36)}`;
    }
  });
}

function refreshScore() {
  score = Object.keys(G.filledMap).length;
  document.getElementById('scoreText').textContent = `창의성 +${score}`;
}

// ═══════════════════════════════════════════════════════════════
// 확인
// ═══════════════════════════════════════════════════════════════
function onConfirm() {
  const total = G ? Object.keys(G.filledMap).length : 0;
  alert(`미니게임 종료!\n창의성 +${total} 획득`);
}

// ═══════════════════════════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════════════════════════
function init() {
  score = 0;
  const def = GRID_DEFS[Math.floor(Math.random() * GRID_DEFS.length)];
  buildGrid(def);
  spawnBlocks();
  document.getElementById('scoreText').textContent = '창의성 +0';
}

init();
</script>
</body>
</html>
