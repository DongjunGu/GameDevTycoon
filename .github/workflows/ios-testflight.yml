name: iOS Build & TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: Build iOS (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: iOS
          buildName: GameDevTycoon
          buildsPath: build

      - name: Find Xcode project
        run: |
          echo "=== workspace root ==="
          ls -la
          echo "=== find xcodeproj ==="
          find . -name "*.xcodeproj" 2>/dev/null | head -20
          find . -name "Unity-iPhone*" 2>/dev/null | head -20

      - name: Install Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > distribution.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import distribution.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "PROFILE_UUID=${UUID}" >> $GITHUB_ENV

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.es.get</key>
              <string>${{ secrets.IOS_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Patch Xcode project signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          ruby << 'EOF'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('build/iOS/GameDevTycoon/Unity-iPhone.xcodeproj')
          team_id = ENV['TEAM_ID']
          profile_name = ENV['PROFILE_NAME']

          # 프로젝트 레벨 설정 패치
          project.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['DEVELOPMENT_TEAM'] = team_id
          end

          # 타겟 레벨 설정 패치
          project.targets.each do |target|
            puts "Patching target: #{target.name}"
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'

              if target.name == 'Unity-iPhone'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name
                puts "  #{config.name}: Manual + profile=#{profile_name}"
              else
                config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
                config.build_settings.delete('PROVISIONING_PROFILE')
                puts "  #{config.name}: Manual, no profile"
              end
            end
          end

          project.save
          puts "Done"
          EOF

      - name: Debug project signing state
        run: |
          echo "=== xcscheme files ==="
          find build/iOS/GameDevTycoon -name "*.xcscheme" | head -5
          echo "=== Unity-iPhone Release buildSettings ==="
          xcodebuild -project build/iOS/GameDevTycoon/Unity-iPhone.xcodeproj \
            -target Unity-iPhone \
            -configuration Release \
            -showBuildSettings 2>/dev/null | grep -E "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM"

      - name: Build .ipa
        run: |
          xcodebuild -project build/iOS/GameDevTycoon/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/GameDevTycoon.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          xcodebuild -exportArchive \
            -archivePath build/GameDevTycoon.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Setup App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ipa/GameDevTycoon.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
